services:
  rm-voice-agent:
    environment:
      # Explicitly tell the app where to find the database
      EKO_DB_PATH: /app/data/eko_agent.db
      DATA_DIR: /app/data
    # Note: eko-deploy manages volume mounts
    # Mount the voice_agent/data directory which contains eko_agent.db with 9 DCs
    volumes:
      - /home/akanksha/voice_agent/data:/app/data
      - /home/akanksha/voice_agent/data:/data
