<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engineering Harness · Eko Sahayak</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="static/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="static/icons/favicon-16.png">
<link rel="apple-touch-icon" href="static/icons/apple-touch-icon.png">
<link rel="stylesheet" href="static/common.css">
<script>try{var t=localStorage.getItem("eko-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
  #harness { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; gap: 0; }
  .harness-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
  .harness-header select, .harness-header button { height: 32px; padding: 0 12px; }
  .harness-body { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); overflow: hidden; }
  .pane { display: flex; flex-direction: column; background: var(--surface); min-width: 0; }
  .pane-header { background: var(--surface-alt); border-bottom: 1px solid var(--border); padding: 12px 16px; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .pane-content { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .trace-list { flex: 1; overflow-y: auto; overflow-x: hidden; }

  .trace-item { border-bottom: 1px solid var(--border); padding: 12px 16px; cursor: pointer; transition: background .15s; min-height: 80px; }
  .trace-item:hover { background: var(--surface-alt); }
  .trace-item.active { background: var(--surface-alt); border-left: 3px solid var(--accent); padding-left: 13px; }
  .trace-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .trace-turn { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .trace-heard { font-size: 12px; color: var(--text); margin: 6px 0; font-style: italic; line-height: 1.3; }
  .trace-meta { display: flex; gap: 12px; font-size: 11px; color: var(--muted); align-items: center; flex-wrap: wrap; }
  .trace-intent { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; background: var(--c1); color: #fff; padding: 3px 8px; border-radius: 3px; }
  .trace-confidence { font-size: 10px; color: var(--muted); }

  .token-health { background: var(--surface-alt); border-bottom: 1px solid var(--border); padding: 12px 16px; }
  .token-bar { display: flex; height: 18px; border-radius: 3px; overflow: hidden; background: var(--surface); border: 1px solid var(--border); margin-bottom: 8px; }
  .token-segment { transition: flex .2s; position: relative; }
  .token-segment.optimal { background: #10b981; } .token-segment.warning { background: #f59e0b; } .token-segment.critical { background: #ef4444; }
  .token-stats { display: flex; gap: 12px; font-size: 11px; flex-wrap: wrap; }
  .token-stat { display: flex; align-items: center; gap: 4px; }
  .token-stat-dot { width: 6px; height: 6px; border-radius: 50%; }

  .thinking-trace { margin: 8px 0; border: 1px solid var(--border); border-radius: 4px; background: var(--surface-alt); }
  .thinking-header { padding: 8px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 12px; user-select: none; }
  .thinking-header::before { content: "▶"; display: inline-block; width: 14px; transition: transform .2s; }
  .thinking-header.open::before { transform: rotate(90deg); }
  .thinking-content { display: none; padding: 10px 12px; border-top: 1px solid var(--border); max-height: 250px; overflow-y: auto; font-size: 11px; font-family: "SF Mono", Monaco, monospace; white-space: pre-wrap; word-break: break-word; color: var(--text); line-height: 1.4; background: var(--surface); }
  .thinking-content.open { display: block; }

  .decision-badge { display: inline-block; padding: 3px 8px; border-radius: 2px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: #fff; }
  .badge-model { background: #0aa2b5; } .badge-rules { background: #f59e0b; } .badge-guard { background: #ef4444; }

  .evaluator-pane { padding: 16px; font-size: 12px; line-height: 1.6; }
  .eval-section { margin-bottom: 16px; }
  .eval-label { font-weight: 600; font-size: 11px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .eval-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .eval-row:last-child { border-bottom: none; }
  .eval-code { background: var(--surface-alt); padding: 8px 12px; border-radius: 3px; font-family: monospace; font-size: 11px; max-height: 150px; overflow-y: auto; margin-top: 6px; }

  .harness-footer { background: var(--surface-alt); border-top: 1px solid var(--border); padding: 8px 16px; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 16px; justify-content: space-between; }
  .live-indicator { display: inline-flex; align-items: center; gap: 6px; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; animation: pulse .8s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

  @media (max-width: 900px) { .harness-body { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="harness">
  <div class="harness-header">
    <span style="font-weight:600">Call ID:</span>
    <select id="callSelect" style="min-width: 200px;"><option value="">Loading calls…</option></select>
    <button id="refreshBtn" class="secondary">↻ Refresh</button>
    <span class="flex"></span>
    <span id="status" style="font-size:11px; color:var(--muted)">Loading…</span>
  </div>

  <div class="harness-body">
    <div class="pane">
      <div class="pane-header">
        🔧 Worker Execution Trace
        <span style="font-size:10px; color:var(--muted); margin-left:auto" id="traceCount"></span>
      </div>
      <div class="token-health">
        <div class="token-bar" id="tokenBar"></div>
        <div class="token-stats" id="tokenStats"></div>
      </div>
      <div class="pane-content">
        <div class="trace-list" id="traceList"></div>
      </div>
    </div>

    <div class="pane">
      <div class="pane-header">✓ Evaluator · Trace Details</div>
      <div class="pane-content" style="overflow-y:auto;">
        <div class="evaluator-pane" id="evaluatorPane">
          <div style="color:var(--muted); text-align:center; padding:40px 20px;">Select a trace from the left pane to view details</div>
        </div>
      </div>
    </div>
  </div>

  <div class="harness-footer">
    <span id="callMeta"></span>
    <span id="footerStatus"></span>
  </div>
</div>

<script src="static/common.js"></script>
<script>
const $ = id => document.getElementById(id);

// ===== Store (Zustand-like) =====
const createStore = (init) => {
  let state = init, listeners = new Set();
  return {
    getState: () => state,
    setState: (u) => { state = { ...state, ...u }; listeners.forEach(cb => cb()); },
    subscribe: (cb) => { listeners.add(cb); return () => listeners.delete(cb); }
  };
};
const store = createStore({ selectedIdx: -1, traces: [], currentCallId: null });

// ===== State =====
let allTraces = [];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ===== Load calls =====
(async () => {
  await loadConfig();

  try {
    const resp = await fetch('/api/calls');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const calls = await resp.json();

    if (calls.length === 0) {
      $('status').textContent = 'No calls found';
      $('footerStatus').textContent = 'No call data available';
      return;
    }

    $('callSelect').innerHTML = calls.map(c => {
      const time = new Date(c.started_at * 1000).toLocaleTimeString('en-IN');
      return `<option value="${c.id}">${c.id} · ${c.csp_name || '?'} (${time})</option>`;
    }).join('');

    $('callSelect').value = calls[0].id;
    $('status').textContent = `${calls.length} call(s) loaded`;
    await loadTraces(calls[0].id);
  } catch (err) {
    $('status').textContent = `Error: ${err.message}`;
    $('callSelect').innerHTML = '<option>Error loading calls</option>';
  }
})();

$('callSelect').addEventListener('change', (e) => {
  if (e.target.value) loadTraces(parseInt(e.target.value));
});

$('refreshBtn').addEventListener('click', () => {
  const callId = $('callSelect').value;
  if (callId) loadTraces(parseInt(callId));
});

async function loadTraces(callId) {
  try {
    $('status').textContent = 'Loading traces…';
    const resp = await fetch(`/api/calls/${callId}/traces`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    allTraces = await resp.json();
    store.setState({ traces: allTraces, currentCallId: callId, selectedIdx: -1 });

    $('traceCount').textContent = `${allTraces.length} trace${allTraces.length === 1 ? '' : 's'}`;
    $('callMeta').textContent = `Call #${callId}`;
    $('status').textContent = `${allTraces.length} trace(s) loaded`;

    renderTokenBar();
    renderTraceList();
    renderEvaluator(null);
  } catch (err) {
    $('status').textContent = `Error: ${err.message}`;
    $('footerStatus').textContent = `Failed to load traces: ${err.message}`;
  }
}

function renderTokenBar() {
  const totals = allTraces.reduce((a, t) => ({
    input: a.input + (t.input_tokens || 0),
    output: a.output + (t.output_tokens || 0)
  }), { input: 0, output: 0 });
  totals.total = totals.input + totals.output;
  const maxTokens = 200000;
  const pct = Math.min((totals.total / maxTokens) * 100, 100);
  const status = pct <= 60 ? 'optimal' : pct <= 80 ? 'warning' : 'critical';

  $('tokenBar').innerHTML = `
    <div class="token-segment ${status}" style="flex: ${pct || 1}"></div>
    <div class="token-segment" style="flex: ${Math.max(100 - pct, 0) || 1}"></div>
  `;

  $('tokenStats').innerHTML = `
    <div class="token-stat">
      <span class="token-stat-dot" style="background:#10b981"></span>
      <span>Input: ${totals.input.toLocaleString()}</span>
    </div>
    <div class="token-stat">
      <span class="token-stat-dot" style="background:#f59e0b"></span>
      <span>Output: ${totals.output.toLocaleString()}</span>
    </div>
    <div class="token-stat">
      <span class="token-stat-dot" style="background:#ef4444"></span>
      <span>Total: ${totals.total.toLocaleString()} (${Math.round(pct)}%)</span>
    </div>
  `;
  $('footerStatus').textContent = `Token usage: ${Math.round(pct)}% of ${(maxTokens/1000).toFixed(0)}k limit`;
}

function renderTraceList() {
  const selected = store.getState().selectedIdx;
  $('traceList').innerHTML = allTraces.map((t, i) => {
    const heard = (t.context?.heard || '').slice(0, 80);
    const intent = t.output?.intent || '?';
    const conf = t.output?.intent_confidence;
    const badge = t.engine === 'rules' ? 'badge-rules' : t.engine === 'model' ? 'badge-model' : 'badge-guard';

    return `<div class="trace-item ${i === selected ? 'active' : ''}" onclick="selectTrace(${i})" style="cursor:pointer">
      <div class="trace-row">
        <span class="trace-turn">Turn ${t.turn_id}</span>
        <span style="font-size:10px; color:var(--muted)">${t.latency_ms}ms</span>
      </div>
      <div class="trace-heard">${esc(heard || '(empty)')}</div>
      <div class="trace-meta">
        <span class="trace-intent">${esc(intent)}</span>
        ${conf !== null && conf !== undefined ? `<span class="trace-confidence">${Math.round(conf * 100)}%</span>` : ''}
        <span class="decision-badge ${badge}">${t.engine}</span>
      </div>
    </div>`;
  }).join('');
}

function selectTrace(idx) {
  store.setState({ selectedIdx: idx });
  renderTraceList();
  renderEvaluator(allTraces[idx]);
}

function renderEvaluator(trace) {
  if (!trace) {
    $('evaluatorPane').innerHTML = '<div style="color:var(--muted); text-align:center; padding:40px 20px;">Select a trace from the left pane to view details</div>';
    return;
  }

  const output = trace.output || {};
  const context = trace.context || {};
  const messages = trace.messages || [];

  let html = `
    <div class="eval-section">
      <div class="eval-label">Decision Metadata</div>
      <div class="eval-row"><span>Engine</span> <strong>${esc(trace.engine)}</strong></div>
      <div class="eval-row"><span>Model</span> <strong>${esc(trace.model || 'N/A')}</strong></div>
      <div class="eval-row"><span>Latency</span> <strong>${trace.latency_ms}ms</strong></div>
      <div class="eval-row"><span>Tokens (in/out)</span> <strong>${trace.input_tokens}/${trace.output_tokens}</strong></div>
      ${trace.error ? `<div class="eval-row" style="color:#ef4444;"><span>Error</span> <strong>${esc(trace.error)}</strong></div>` : ''}
    </div>

    <div class="eval-section">
      <div class="eval-label">Input Context</div>
      <div class="eval-row"><span>Heard</span> <strong>${esc((context.heard || '').slice(0, 60))}</strong></div>
      <div class="eval-row"><span>CSP</span> <strong>${esc(context.csp?.name || 'N/A')}</strong></div>
      <div class="eval-row"><span>RM</span> <strong>${esc(context.rm_name || 'N/A')}</strong></div>
      <div class="eval-row"><span>Past Tickets</span> <strong>${(context.past_tickets || []).length}</strong></div>
      <div class="eval-row"><span>History Turns</span> <strong>${context.history_turns || 0}</strong></div>
    </div>

    <div class="eval-section">
      <div class="eval-label">Decision Output</div>
      <div class="eval-row"><span>Intent</span> <strong>${esc(output.intent || '?')}</strong></div>
      <div class="eval-row"><span>Confidence</span> <strong>${output.intent_confidence !== null ? Math.round((output.intent_confidence || 0) * 100) + '%' : 'N/A'}</strong></div>
      <div class="eval-row"><span>Understood</span> <strong>${output.understood ? 'Yes' : 'No'}</strong></div>
      <div class="eval-row"><span>Language</span> <strong>${esc(output.language || '?')}</strong></div>
    </div>
  `;

  if (output.slots && Object.keys(output.slots).length > 0) {
    html += `
      <div class="eval-section">
        <div class="eval-label">Extracted Slots</div>
        <div class="eval-code">${Object.entries(output.slots).map(([k, v]) => `<div><strong>${esc(k)}:</strong> ${esc(String(v))}</div>`).join('')}</div>
      </div>
    `;
  }

  if (trace.system_prompt) {
    html += `
      <div class="eval-section">
        <div class="eval-label">System Prompt</div>
        <div class="eval-code">${esc(trace.system_prompt.slice(0, 500))}</div>
      </div>
    `;
  }

  if (messages && messages.length > 0) {
    html += `
      <div class="eval-section">
        <div class="eval-label">Messages (${messages.length})</div>
        <div class="eval-code">${esc(JSON.stringify(messages.slice(-2), null, 2).slice(0, 400))}</div>
      </div>
    `;
  }

  if (trace.raw_output) {
    html += `
      <div class="eval-section">
        <div class="eval-label">Raw LLM Output</div>
        <div class="eval-code">${esc(JSON.stringify(trace.raw_output, null, 2).slice(0, 500))}</div>
      </div>
    `;
  }

  $('evaluatorPane').innerHTML = html;
}

store.subscribe(() => {
  renderTraceList();
});
</script>
</body>
</html>
