# Eko Deploy Configuration for rm-voice-agent

[project]
name = "rm-voice-agent"

[services.web]
port = 8000
host = "all"

# Use /healthz for health checks (returns 200, no auth required)
[services.web.health]
paths = ["/healthz", "/health", "/api/health", "/ping"]

# Enable websocket support
[services.web.route]
websocket = true
max_body = "50m"
timeout = 120

# Keep data across deploys
[[services.web.volumes]]
path = "/app/data"
persistent = true

[[services.web.volumes]]
path = "/app/data/logs"
persistent = true

[[services.web.volumes]]
path = "/app/data/recordings"
persistent = true

# Environment variables that must be set
[secrets]
required = ["APP_BASE_URL", "SESSION_SECRET"]
optional = ["GROQ_API_KEY", "ANTHROPIC_API_KEY", "GEMINI_API_KEY"]
