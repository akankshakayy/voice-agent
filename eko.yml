services:
  rm-voice-agent:
    environment:
      # Point to the database in the mounted volume
      EKO_DB_PATH: /app/data/eko_agent.db
    # Note: eko-deploy manages volume mounts; production uses /data
    # For local dev with docker-compose, mount your data directory
    # Format: host_path:container_path
    volumes:
      # Database and recordings storage (must be persistent across restarts)
      - /data/rm-voice-agent:/app/data
      # Alternative mount for backward compatibility
      - /data/rm-voice-agent:/data
