<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recordings · Eko Sahayak</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="static/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="static/icons/favicon-16.png">
<link rel="apple-touch-icon" href="static/icons/apple-touch-icon.png">
<link rel="stylesheet" href="static/common.css">
<script>try{var t=localStorage.getItem("eko-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .filters input { flex: 1; min-width: 200px; }
  .upload { display: grid; gap: 10px; }
  .upload .row { display: grid; grid-template-columns: 2fr 1.2fr 1fr 1.2fr auto; gap: 8px; align-items: end; }
  .upload label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .upload input[type=file] { padding: 5px 6px; border: 1px dashed var(--border); border-radius: var(--radius-sm); background: var(--panel-2); }
  .upload .row label > * { height: 38px; box-sizing: border-box; }
  .results { display: grid; gap: 4px; font-size: 13px; }
  .results .err { color: var(--bad); } .results .ok { color: var(--ok); }
  @media (max-width: 900px) { .upload .row { grid-template-columns: 1fr 1fr; } }
  td .sum { max-width: 420px; }
  audio { width: 100%; margin: 4px 0 12px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 14px; }
  .lines { display: grid; gap: 2px; }
  .line { display: grid; grid-template-columns: 52px 92px 1fr; gap: 8px; padding: 6px 8px; border-radius: var(--radius-sm); align-items: start; }
  .line .who small { display: block; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--muted); }
  .line[data-v="1"] .who { color: var(--accent); } .line[data-v="2"] .who { color: var(--c2); }
  .line[data-v="3"] .who { color: var(--c7); } .line[data-v="4"] .who { color: var(--c5); }
  .line[data-v="2"] { background: color-mix(in srgb, var(--c2) 7%, var(--panel)); }
  .line[data-v="3"] { background: color-mix(in srgb, var(--c7) 7%, var(--panel)); }
  .line .t { font-family: var(--font-mono); font-size: 12px; color: var(--accent); background: none; border: 0; padding: 2px 0; cursor: pointer;
    text-align: left; box-shadow: none; }
  .line .t:hover { text-decoration: underline; filter: none; box-shadow: none; }
  .line .who { font-size: 11px; font-weight: 700; padding: 2px 0; text-transform: uppercase; letter-spacing: .04em; }
  .line.rm .who { color: var(--accent); } .line.csp .who { color: var(--c2); }
  .line.other .who, .line.unknown .who { color: var(--muted); }
  .line.csp { background: color-mix(in srgb, var(--c2) 7%, var(--panel)); }
  .line.issue { box-shadow: inset 3px 0 0 var(--c3); }
  .line.playing { background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }
  .note { padding: 10px 12px; border-radius: var(--radius-sm); background: var(--panel-2); font-size: 13px; margin: 6px 0 12px; }
  .note.bad { background: var(--bad-soft); color: var(--bad); }
  .downloads { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
  .downloads a { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--panel); font-size: 13px; font-weight: 600; }
  .downloads a:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
  .report { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 16px 12px; margin: 8px 0 16px;
    background: var(--panel-2); line-height: 1.55; }
  .report h2 { font-size: 15px; margin: 16px 0 6px; } .report h3 { font-size: 13.5px; margin: 12px 0 4px; }
  .report ul { margin: 4px 0; padding-left: 20px; } .report li { margin: 3px 0; } .report p { margin: 6px 0; }
  .report-meta { font-size: 12px; color: var(--muted); margin-top: -4px; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 18px; }
  .sec-head h3 { margin: 0; }
  .sec-head button { padding: 4px 10px; font-size: 12.5px; }
  .edit-l { display: grid; gap: 4px; font-size: 12px; color: var(--muted); margin: 8px 0; }
  .edit-l textarea { width: 100%; box-sizing: border-box; font-size: 13.5px; line-height: 1.5; resize: vertical; }
  .note.fixed { background: color-mix(in srgb, var(--ok) 10%, var(--panel)); }
  .note .linkish { background: none; border: 0; box-shadow: none; padding: 0; color: var(--accent); cursor: pointer; font-size: inherit; text-decoration: underline; }
  .line.editing { grid-template-columns: 52px 110px 1fr 28px; background: var(--panel-2); }
  .line.editing .whosel { display: grid; gap: 4px; }
  .line.editing select { padding: 3px 4px; font-size: 12px; }
  .line.editing textarea { width: 100%; box-sizing: border-box; padding: 4px 8px; font-size: 13.5px; line-height: 1.45; resize: vertical; min-height: 34px; }
  .line.editing .del { padding: 2px 6px; background: none; border: 0; box-shadow: none; color: var(--muted); cursor: pointer; font-size: 15px; }
  .line.editing .del:hover { color: var(--bad); }
  .line.removed { opacity: .45; } .line.removed textarea { text-decoration: line-through; }
  .line .heard { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .edit-bar { position: sticky; bottom: 0; display: flex; gap: 8px; align-items: center; padding: 10px 0; background: var(--panel); border-top: 1px solid var(--border); margin-top: 8px; }
</style>
</head>
<body>
<header class="top" id="nav"></header>
<main>
  <div class="kpis" id="kpis"></div>

  <section class="panel" id="uploadPanel" hidden style="--tone:var(--c6);margin-bottom:16px">
    <h2>Add recordings</h2>
    <p class="small muted" style="margin-top:-6px">For calls you have as files (e.g. shared on WhatsApp). They are transcribed and summarised just like the ones the phones upload.
      Each file's own date is used as the call time.</p>
    <form class="upload" id="uploadForm">
      <div class="row">
        <label>Recordings<input type="file" id="uFiles" multiple accept="audio/*,.m4a,.mp3,.aac,.amr,.3gp,.ogg,.opus,.wav,.flac,.mp4,.webm" required></label>
        <label>RM who made the calls<select id="uRm"></select></label>
        <label>Direction<select id="uDir"><option value="unknown">Not sure</option><option value="outgoing">RM called CSP</option><option value="incoming">CSP called RM</option></select></label>
        <label>CSP's phone (optional)<input id="uPhone" inputmode="tel" placeholder="If all files are one CSP"></label>
        <button type="submit" id="uBtn">Upload</button>
      </div>
      <div class="results" id="uResults"></div>
    </form>
  </section>

  <section class="panel" style="--tone:var(--c5)">
    <h2>Recorded calls</h2>
    <div class="filters">
      <select id="fStatus"><option value="">All statuses</option><option value="done">Processed</option><option value="new">Waiting</option><option value="failed">Failed</option></select>
      <select id="fCat"><option value="">All issue types</option></select>
      <select id="fRm" hidden><option value="">All RMs</option></select>
      <input id="fSearch" placeholder="Search CSP, number, summary, transcript…">
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Call time</th><th>RM</th><th>CSP</th><th>Length</th><th>Issue</th><th>Status</th><th>From</th></tr></thead>
      <tbody id="rows"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody>
    </table></div>
  </section>
</main>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer"></aside>

<script src="static/common.js"></script>
<script>
const $ = id => document.getElementById(id);
const REC_STATUS = { new: ["Waiting", "b-info"], done: ["Processed", "b-ok"], failed: ["Failed", "b-bad"] };
const RESOLUTION = { resolved_on_call: ["Solved on the call", "b-ok"], follow_up_promised: ["Follow-up promised", "b-info"],
  escalated: ["Escalated", "b-warn"], no_issue: ["No issue", ""], unclear: ["Outcome unclear", ""] };
const MOOD = { positive: ["CSP happy", "b-ok"], neutral: ["CSP calm", ""], frustrated: ["CSP frustrated", "b-warn"], angry: ["CSP angry", "b-bad"] };
const SPEAKER = { rm: "RM", csp: "CSP", other: "Other", unknown: "?" };
// Voices separated from the sound (A, B, C…) are shown as Speaker 1, 2, 3…; RM/CSP only on RM–CSP calls
const voiceNo = l => l.voice ? l.voice.charCodeAt(0) - 64 : null;
function whoLabel(l, r) {
  const n = voiceNo(l), role = r.is_csp_call && l.speaker && l.speaker !== "unknown" ? SPEAKER[l.speaker] : "";
  if (n) return `Speaker ${n}${role ? `<small>${role}</small>` : ""}`;
  return SPEAKER[l.speaker] || "?";
}
let ROWS = [], RMS = [], OPEN = null, STAFF = false, EDITING = false;

const statusBadge = r => r.status === "new" && r.attempts ? `<span class="badge b-warn">Retrying</span>` : badge(REC_STATUS, r.status);
const who = r => r.csp_name ? esc(r.csp_name) : r.other_number ? esc(r.other_number) : `<span class="muted">Unknown number</span>`;
const clock = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

(async () => {
  await loadConfig();
  const me = await loadMe();
  STAFF = me.role === "admin" || me.role === "ops";
  RMS = await api("api/rms");
  $("nav").innerHTML = navHtml("recordings") + `<div class="right"><span class="small muted" id="updated"></span></div>`;
  $("fCat").innerHTML += Object.entries(CONFIG.categories).map(([k, v]) => `<option value="${k}">${esc(v.label)}</option>`).join("")
    + `<option value="unknown">No issue / unknown</option>`;
  if (STAFF) {
    $("uploadPanel").hidden = false;
    $("fRm").hidden = false;
    const opts = RMS.map(r => `<option value="${r.id}">${esc(r.name)} · ${esc(r.region)}</option>`).join("");
    $("uRm").innerHTML = opts + `<option value="0">No RM (not an RM call)</option>`;
    $("fRm").innerHTML += opts;
  }
  ["fStatus", "fCat", "fRm"].forEach(id => $(id).onchange = render);
  $("fSearch").oninput = render;
  $("drawerBg").onclick = closeDrawer;
  $("uploadForm").onsubmit = upload;
  await refresh();
  const id = Number(location.hash.slice(1));
  if (id) openRec(id);
})();

async function refresh() {
  const data = await api("api/recordings?limit=1000");
  ROWS = data.recordings;
  const c = data.counts, done = ROWS.filter(r => r.status === "done");
  const secs = ROWS.reduce((a, r) => a + (r.duration_sec || 0), 0);
  $("kpis").innerHTML = [
    ["Recordings", ROWS.length, `${fmtDur(secs)} of calls`, "--c1"],
    ["Processed", c.done || 0, "transcript and summary ready", "--c2"],
    ["Waiting", c.new || 0, c.new ? "being processed" : "nothing waiting", "--c6"],
    ["Failed", c.failed || 0, c.failed ? "open one to see why" : "none", "--c4"],
    ["CSP calls", done.filter(r => r.is_csp_call).length, "of the processed ones", "--c5"],
  ].map(([l, v, s, t]) => `<div class="kpi" style="--tone:var(${t})"><div class="label">${l}</div><div class="value">${num(v)}</div><div class="sub">${s}</div></div>`).join("");
  $("updated").textContent = "updated " + new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });
  render();
  if (OPEN && !EDITING) {
    const r = ROWS.find(x => x.id === OPEN.id);
    if (r && r.status !== OPEN.status) openRec(OPEN.id);         // finished processing while open
    else if (OPEN.status === "done" && !OPEN.report_md && !OPEN.report_error && OPEN.transcript?.length) openRec(OPEN.id);
  }
  clearTimeout(refresh.t);
  const writing = OPEN && OPEN.status === "done" && !OPEN.report_md && !OPEN.report_error;
  refresh.t = setTimeout(refresh, (c.new || writing ? 8 : 30) * 1000);
}

function render() {
  const st = $("fStatus").value, cat = $("fCat").value, rm = $("fRm").value, q = $("fSearch").value.toLowerCase();
  const rows = ROWS.filter(r => (!st || r.status === st) && (!cat || (r.intent || "unknown") === cat) && (!rm || String(r.rm_id) === rm)
    && (!q || JSON.stringify([r.csp_name, r.csp_code, r.other_number, r.summary, r.orig_name, r.rm_name]).toLowerCase().includes(q)));
  $("rows").innerHTML = rows.length ? rows.map(r => `<tr class="clickable" onclick="openRec(${r.id})">
      <td class="nowrap">${fmtTime(r.started_at || r.uploaded_at)}<div class="small muted">${r.direction === "incoming" ? "CSP called" : r.direction === "outgoing" ? "RM called" : ""}</div></td>
      <td>${esc(r.rm_name || "–")}</td>
      <td>${who(r)}${r.csp_code ? `<div class="small muted">${esc(r.csp_code)}</div>` : ""}</td>
      <td class="mono nowrap">${fmtDur(r.duration_sec)}</td>
      <td>${r.intent && r.intent !== "unknown" ? catChip(r.intent) : r.status === "done" ? '<span class="muted small">No issue</span>' : ""}
        ${r.summary ? `<div class="small muted sum">${esc(r.summary.slice(0, 110))}</div>` : ""}</td>
      <td>${statusBadge(r)}</td>
      <td><span class="badge ${r.source === "phone" ? "b-accent" : ""}">${r.source === "phone" ? "Phone app" : "Added by hand"}</span></td></tr>`).join("")
    : `<tr><td colspan="7" class="empty">${ROWS.length ? "No recordings match" : "No recordings yet. They appear here as phones upload them" + (STAFF ? ", or add some above." : ".")}</td></tr>`;
}

async function openRec(id) {
  let r;
  try { r = await api(`api/recordings/${id}`); } catch (e) { return; }
  OPEN = r; EDITING = false;
  history.replaceState(null, "", "#" + id);
  const canEdit = r.status === "done" && r.transcript?.length;
  const sumFixed = r.agent_summary != null || r.agent_report_md != null;
  // The transcript was corrected after the summary was written: the summary may repeat what was misheard
  const stale = r.report_md && r.transcript_edited_at && r.transcript_edited_at > (r.report_at || 0);
  const res = RESOLUTION[r.resolution], mood = MOOD[r.sentiment];
  const lines = r.transcript || [];
  const slots = Object.entries(r.slots || {});
  $("drawer").innerHTML = `<div class="drawer-head"><div><h2>${who(r)}</h2>
      <div class="sub">${fmtTime(r.started_at || r.uploaded_at)} · ${esc(r.rm_name || "")} · ${fmtDur(r.duration_sec)}</div></div>
      <button class="secondary" onclick="closeDrawer()">Close</button></div>
    <audio id="player" controls preload="metadata" src="api/recordings/${r.id}/audio"></audio>
    <div class="badges">${statusBadge(r)}
      ${r.intent && r.intent !== "unknown" ? catChip(r.intent) : ""}
      ${res ? `<span class="badge ${res[1]}">${res[0]}</span>` : ""}
      ${mood ? `<span class="badge ${mood[1]}">${mood[0]}</span>` : ""}
      ${r.is_csp_call === 0 ? '<span class="badge b-warn">Not a CSP work call</span>' : ""}</div>
    ${r.status === "new" ? `<div class="note">${r.attempts ? `Last try failed: ${esc(r.error || "")}. Trying again soon.` : "Being transcribed and summarised. This page updates by itself."}</div>` : ""}
    ${r.status === "failed" ? `<div class="note bad">Couldn't process this recording: ${esc(r.error || "unknown error")}</div>` : ""}
    ${r.transcript?.length ? `<div class="downloads">
      <a href="api/recordings/${r.id}/download/report.docx" download>⬇ Word document (summary + transcript)</a>
      <a href="api/recordings/${r.id}/download/transcript.txt" download>⬇ Transcript (.txt)</a>
      ${r.report_md ? `<a href="api/recordings/${r.id}/download/summary.md" download>⬇ Summary (.md)</a>` : ""}</div>` : ""}
    <div id="summaryBox">${r.report_md ? `<div class="sec-head"><h3>Detailed summary</h3>
        ${canEdit ? `<button class="secondary" onclick="editSummary()">✎ Correct summary</button>` : ""}</div>
      <p class="report-meta">Written from the whole transcript${r.report_s != null ? ` in ${secs(r.report_s)}` : ""}${r.report_model ? ` · ${esc(r.report_model)}` : ""}. Times in [brackets] point to the transcript below.</p>
      ${sumFixed ? fixedNote(r, "summary") : ""}
      ${stale ? `<div class="note">The transcript was corrected after this summary was written.
        <button class="linkish" onclick="resummarize(${r.id})">Write the summary again from the corrected transcript</button></div>` : ""}
      <div class="report" id="report">${mdHtml(r.report_md)}</div>`
      : r.report_error ? `<div class="note bad">The summary couldn't be written: ${esc(r.report_error)}</div>`
      : r.status === "done" && r.transcript?.length ? `<div class="note">Writing the detailed summary… This page updates by itself.</div>`
      : r.summary ? `<div class="sec-head"><h3>Summary</h3>${canEdit ? `<button class="secondary" onclick="editSummary()">✎ Correct summary</button>` : ""}</div>
        ${sumFixed ? fixedNote(r, "summary") : ""}<p>${esc(r.summary)}</p>` : ""}</div>
    ${r.rm_handling ? `<h3>How the RM handled it</h3><p>${esc(r.rm_handling)}</p>` : ""}
    <dl class="kv">
      ${slots.map(([k, v]) => `<dt>${esc(CONFIG.slot_labels[k] || k)}</dt><dd>${esc(v)}</dd>`).join("")}
      ${r.intent_confidence != null ? `<dt>Issue type confidence</dt><dd>${Math.round(r.intent_confidence * 100)}%</dd>` : ""}
      ${r.language ? `<dt>Language</dt><dd>${esc({ hi: "Hindi", hinglish: "Hinglish", en: "English" }[r.language] || r.language)}</dd>` : ""}
      ${r.other_number ? `<dt>Other number</dt><dd>${esc(r.other_number)}</dd>` : ""}
      <dt>Added</dt><dd>${fmtTime(r.uploaded_at)} · ${r.source === "phone" ? "by the phone app" : "by hand"}${r.orig_name ? ` · <span class="muted">${esc(r.orig_name)}</span>` : ""}</dd>
      ${r.processed_at ? `<dt>Processed</dt><dd>${fmtTime(r.processed_at)}${r.model ? ` · <span class="muted">${esc(r.model)}</span>` : ""}</dd>` : ""}
      ${r.timing ? `<dt>Time taken</dt><dd>${timingHtml(r.timing)}</dd>` : ""}
      ${r.timing?.stt ? `<dt>Transcribed by</dt><dd>${esc(r.timing.stt)}</dd>` : ""}
    </dl>
    ${lines.length ? `<div class="sec-head"><h3>Transcript</h3>
        ${canEdit ? `<button class="secondary" onclick="editTranscript()">✎ Correct transcript</button>` : ""}</div>
      ${r.transcript_edited_at ? fixedNote(r, "transcript") : ""}
      <p class="small muted" style="margin-top:4px">Click a time to play from there. Personal numbers (Aadhaar, phone, OTP…) are hidden.${r.issue_segment >= 0 ? " The orange line is where the CSP explains the problem." : ""}</p>
      ${lines.some(l => l.voice) ? `<p class="small muted" style="margin-top:-4px">Speakers are told apart by their voices: ${[...new Set(lines.map(l => l.voice).filter(Boolean))].length} found.</p>` : ""}
      <div class="lines" id="lines">${lines.map((l, i) => `<div class="line ${esc(l.speaker || "unknown")} ${i === r.issue_segment ? "issue" : ""}" data-v="${voiceNo(l) || ""}" data-s="${l.start}" data-e="${l.end}">
        <button class="t" onclick="seek(${l.start})" aria-label="Play from ${clock(l.start)}">${clock(l.start)}</button>
        <span class="who">${whoLabel(l, r)}</span><span>${esc(l.text)}${l.heard != null && SHOW_HEARD ? `<span class="heard">Heard: ${esc(l.heard)}</span>` : ""}</span></div>`).join("")}</div>`
      : r.status === "done" ? `<p class="muted">No speech was found in this recording.</p>` : ""}
    ${STAFF ? `<div class="acts"><button class="secondary" onclick="reprocess(${r.id})">Process again</button>
      ${r.transcript?.length ? `<button class="secondary" onclick="resummarize(${r.id})">Write summary again</button>` : ""}
      ${ME.role === "admin" ? `<button class="danger" onclick="removeRec(${r.id})">Delete recording</button>` : ""}</div>` : ""}`;
  $("drawer").classList.add("open"); $("drawerBg").classList.add("open");
  const p = $("player");
  p.ontimeupdate = () => document.querySelectorAll("#lines .line").forEach(el =>
    el.classList.toggle("playing", p.currentTime >= +el.dataset.s && p.currentTime < +el.dataset.e));
}

const secs = s => s == null ? "–" : s >= 60 ? `${Math.floor(s / 60)}m ${String(Math.round(s % 60)).padStart(2, "0")}s` : `${s.toFixed(1)}s`;
// The summary's small Markdown subset (headings, bullets, bold), escaped first so nothing in it can run
function mdHtml(md) {
  let out = "", list = false;
  for (const raw of md.split("\n")) {
    let l = esc(raw.trim()).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    if (/^[-*] /.test(l)) { if (!list) { out += "<ul>"; list = true; } out += `<li>${l.slice(2)}</li>`; continue; }
    if (list) { out += "</ul>"; list = false; }
    const h = l.match(/^(#{1,4})\s*(.*)$/);
    if (h) out += `<h${Math.max(2, Math.min(h[1].length, 4))}>${h[2]}</h${Math.max(2, Math.min(h[1].length, 4))}>`;
    else if (l) out += `<p>${l}</p>`;
  }
  return out + (list ? "</ul>" : "");
}

function timingHtml(t) {
  const step = (label, s, reused) => s == null ? "" : `<div>${label}: <b>${secs(s)}</b>${reused ? ' <span class="muted small">(from an earlier run)</span>' : ""}</div>`;
  const fresh = t.total_s;
  return `<div><b>${secs(fresh)}</b> this run</div>`
    + step(t.stt && t.stt.startsWith("Sarvam") ? "Transcription and speakers (Sarvam)" : "Transcription (Whisper)", t.transcribe_s, t.transcribe_reused)
    + step("Telling speakers apart", t.voices_s, t.voices_reused)
    + step("Summary and review", t.review_s, false);
}

// ---- a person's corrections: saved with the machine's version beside them, to measure and train on
let SHOW_HEARD = false;
const errText = e => { try { return JSON.parse(e.message.replace(/^\d+ /, "")).detail || e.message; } catch (_) { return e.message; } };
function fixedNote(r, what) {
  const n = what === "transcript" ? (r.transcript || []).filter(l => l.heard != null).length : 0;
  return `<div class="note fixed">Corrected by ${esc(r.edited_by || "someone")} · ${fmtTime(r.edited_at)}.
    ${what === "transcript" && n ? `${n} line${n > 1 ? "s" : ""} changed. <button class="linkish" onclick="SHOW_HEARD = !SHOW_HEARD; openRec(${r.id})">${SHOW_HEARD ? "Hide" : "Show"} what speech-to-text heard</button>` : ""}
    ${what === "summary" ? `<button class="linkish" onclick="showAgentSummary()">Show the AI's version</button>` : ""}</div>`;
}
function showAgentSummary() {
  const r = OPEN, w = window.open("", "_blank");
  if (!w) return;
  w.document.title = "AI's summary";
  w.document.body.innerHTML = `<pre style="white-space:pre-wrap;font:14px/1.5 system-ui;max-width:800px;margin:24px auto"></pre>`;
  w.document.querySelector("pre").textContent = `One-line summary:\n${r.agent_summary ?? r.summary ?? ""}\n\nDetailed summary:\n${r.agent_report_md ?? r.report_md ?? ""}`;
}
function editSummary() {
  EDITING = true;
  $("summaryBox").innerHTML = `<div class="sec-head"><h3>Correct the summary</h3></div>
    <p class="small muted">Fix anything the AI got wrong. Your version is shown and downloaded from now on; the AI's is kept to learn from.</p>
    <label class="edit-l">One-line summary (shown in the list of calls)<textarea id="eSum" rows="2"></textarea></label>
    ${OPEN.report_md ? `<label class="edit-l">Detailed summary (## heading, - bullet, **bold**)<textarea id="eReport" rows="20"></textarea></label>` : ""}
    <div class="acts" style="margin-top:6px"><button onclick="saveSummary()">Save corrections</button>
      <button class="secondary" onclick="openRec(OPEN.id)">Cancel</button></div>`;
  $("eSum").value = OPEN.summary || "";
  if ($("eReport")) $("eReport").value = OPEN.report_md || "";
  $("eSum").focus();
}
async function saveSummary() {
  const body = { summary: $("eSum").value };
  if ($("eReport")) body.report_md = $("eReport").value;
  await saveEdits(body);
}
function editTranscript() {
  EDITING = true;
  const r = OPEN, voices = [...new Set(r.transcript.map(l => l.voice).filter(Boolean))].sort();
  const roles = r.is_csp_call !== 0;
  $("lines").innerHTML = r.transcript.map((l, i) => `<div class="line editing" data-i="${i}">
      <button class="t" onclick="seek(${l.start})" aria-label="Play from ${clock(l.start)}">${clock(l.start)}</button>
      <span class="whosel">
        ${voices.length ? `<select class="ev" aria-label="Voice">${voices.map(v => `<option value="${v}" ${v === l.voice ? "selected" : ""}>Speaker ${voiceNo({ voice: v })}</option>`).join("")}</select>` : ""}
        ${roles || !voices.length ? `<select class="es" aria-label="Who spoke">${Object.entries(SPEAKER).map(([k, v]) => `<option value="${k}" ${k === (l.speaker || "unknown") ? "selected" : ""}>${v === "?" ? "Not sure" : v}</option>`).join("")}</select>` : ""}
      </span>
      <textarea class="et" rows="1" aria-label="Line at ${clock(l.start)}"></textarea>
      <button class="del" title="Remove this line (e.g. nobody said it)" onclick="toggleLine(this)">✕</button></div>`).join("")
    + `<div class="edit-bar"><button onclick="saveTranscript()">Save corrections</button>
      <button class="secondary" onclick="openRec(OPEN.id)">Cancel</button>
      <span class="small muted">Play a line with its time, fix the words or the speaker. ✕ removes a line nobody said.</span></div>`;
  document.querySelectorAll("#lines .line.editing").forEach(el => {
    const ta = el.querySelector(".et");
    ta.value = r.transcript[+el.dataset.i].text;
    const fit = () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + 2 + "px"; };
    ta.oninput = fit; fit();
  });
}
function toggleLine(btn) {
  const el = btn.closest(".line"), gone = el.classList.toggle("removed");
  el.querySelector(".et").disabled = gone;
  btn.textContent = gone ? "↺" : "✕"; btn.title = gone ? "Keep this line" : "Remove this line (e.g. nobody said it)";
}
async function saveTranscript() {
  const lines = [...document.querySelectorAll("#lines .line.editing:not(.removed)")].map(el => ({
    i: +el.dataset.i, text: el.querySelector(".et").value,
    speaker: el.querySelector(".es")?.value, voice: el.querySelector(".ev")?.value }));
  const removed = document.querySelectorAll("#lines .line.removed").length;
  if (removed && !confirm(`Remove ${removed} line${removed > 1 ? "s" : ""} from the transcript?`)) return;
  await saveEdits({ lines });
}
async function saveEdits(body) {
  try {
    const res = await api(`api/recordings/${OPEN.id}`, { method: "PATCH", body });
    toast(res.changed ? "Corrections saved" : "Nothing changed");
    EDITING = false; await openRec(OPEN.id); refresh();
  } catch (e) { toast(errText(e)); }
}

function seek(t) { const p = $("player"); p.currentTime = t; p.play().catch(() => {}); }
function closeDrawer() {
  if (EDITING && !confirm("Close without saving your corrections?")) return;
  EDITING = false;
  $("drawer").classList.remove("open"); $("drawerBg").classList.remove("open");
  $("player")?.pause(); OPEN = null; history.replaceState(null, "", location.pathname);
}
async function resummarize(id) {
  if (OPEN?.agent_report_md != null && !confirm("The summary was corrected by hand. Writing it again replaces those corrections (they stay on record). Go ahead?")) return;
  await api(`api/recordings/${id}/summarize`, { method: "POST" }); toast("Writing the summary again"); openRec(id);
  setTimeout(() => OPEN?.id === id && !EDITING && openRec(id), 15000);
}
async function reprocess(id) {
  if (OPEN?.transcript_edited_at && !confirm("Your transcript corrections are kept: the issue type, details and summaries are worked out again from the corrected text. Go ahead?")) return;
  await api(`api/recordings/${id}/reprocess`, { method: "POST" }); toast("Processing again"); await refresh(); openRec(id); }
async function removeRec(id) {
  if (!confirm("Delete this recording and its transcript for good?")) return;
  await api(`api/recordings/${id}`, { method: "DELETE" }); closeDrawer(); toast("Recording deleted"); refresh();
}

async function upload(e) {
  e.preventDefault();
  const files = [...$("uFiles").files];
  if (!files.length) return;
  const fd = new FormData();
  files.forEach(f => fd.append("audio", f, f.name));
  fd.append("rm_id", $("uRm").value);
  fd.append("started_at", files.map(f => f.lastModified || "").join(","));
  fd.append("direction", $("uDir").value);
  fd.append("other_number", $("uPhone").value.trim());
  $("uBtn").disabled = true;
  $("uResults").innerHTML = `<div class="muted">Uploading ${files.length} file${files.length > 1 ? "s" : ""}…</div>`;
  try {
    const r = await fetch("api/recordings/upload", { method: "POST", body: fd });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || `Upload failed (${r.status})`);
    const { results } = await r.json();
    $("uResults").innerHTML = results.map(x => x.error ? `<div class="err">✗ ${esc(x.file)}: ${esc(x.error)}</div>`
      : `<div class="ok">✓ ${esc(x.file)}${x.duplicate ? " was already here" : " added"}</div>`).join("");
    $("uploadForm").reset();
    refresh();
  } catch (err) {
    $("uResults").innerHTML = `<div class="err">${esc(err.message)}</div>`;
  } finally { $("uBtn").disabled = false; }
}
</script>
</body>
</html>
